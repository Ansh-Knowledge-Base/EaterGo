<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Food | EaterGo</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:"DM Sans",sans-serif;
  background:#fffaf7;
  color:#191919;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  text-decoration:none;
  color:inherit;
}

.header{
  height:74px;
  background:#fff;
  border-bottom:1px solid #eee;
  position:sticky;
  top:0;
  z-index:5000;
}

.wrap{
  width:min(1200px,calc(100% - 40px));
  margin:auto;
}

.nav{
  height:74px;
  display:flex;
  align-items:center;
  gap:24px;
}

.logo img{
  width:126px;
  height:52px;
  object-fit:contain;
}

.links{
  display:flex;
  gap:28px;
  margin-left:auto;
}

.links a{
  font-size:13px;
  font-weight:700;
}

.links a:hover{
  color:#ff4d2d;
}

.actions{
  display:flex;
  align-items:center;
  gap:8px;
}

#guest{
  display:flex;
  align-items:center;
  gap:8px;
}

.login{
  padding:11px 13px;
  font-size:12px;
  font-weight:800;
}

.signup{
  padding:11px 16px;
  background:#ff4d2d;
  color:#fff;
  border-radius:11px;
  font-size:12px;
  font-weight:800;
}

.profile{
  position:relative;
  z-index:99999;
}

.pbtn{
  height:43px;
  padding:4px 9px 4px 5px;
  border:1px solid #eee;
  background:#fff;
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:8px;
}

.avatar{
  width:34px;
  height:34px;
  border-radius:50%;
  overflow:hidden;
  background:#ff4d2d;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:11px;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.pname{
  max-width:100px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:12px;
  font-weight:800;
}

.menu{
  display:none;
  position:absolute;
  right:0;
  top:52px;
  width:260px;
  padding:10px;
  background:#fff;
  border:1px solid #eee;
  border-radius:16px;
  box-shadow:0 20px 55px rgba(0,0,0,.16);
  z-index:999999;
}

.menu.show{
  display:block;
}

.info{
  padding:13px;
  background:#fff5f1;
  border-radius:12px;
  margin-bottom:7px;
}

.info b,
.info span{
  display:block;
}

.info span{
  font-size:11px;
  color:#888;
  margin-top:3px;
  overflow:hidden;
  text-overflow:ellipsis;
}

.mi{
  width:100%;
  border:0;
  background:#fff;
  text-align:left;
  padding:11px 12px;
  border-radius:9px;
  font-size:12px;
  font-weight:700;
}

.mi:hover{
  background:#fff5f1;
  color:#ff4d2d;
}

.logout{
  color:#d93025;
}

.cart{
  position:relative;
  width:42px;
  height:42px;
  border:1px solid #eee;
  background:#fff;
  border-radius:12px;
  font-size:18px;
}

.cc{
  position:absolute;
  right:-5px;
  top:-6px;
  min-width:18px;
  height:18px;
  border-radius:20px;
  background:#ff4d2d;
  color:#fff;
  font-size:10px;
  display:grid;
  place-items:center;
  font-weight:800;
}

main{
  padding:35px 0 70px;
}

h1{
  font-family:"Playfair Display",serif;
  font-size:34px;
}

.sub{
  font-size:13px;
  color:#777;
  margin:7px 0 20px;
}

.search{
  display:flex;
  background:#fff;
  border:1px solid #eee;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:20px;
}

.search input{
  flex:1;
  height:54px;
  border:0;
  outline:0;
  padding:0 18px;
  font-size:13px;
}

.search button{
  margin:5px 7px 5px 0;
  padding:0 22px;
  border:0;
  border-radius:10px;
  background:#ff4d2d;
  color:#fff;
  font-size:12px;
  font-weight:800;
}

.cats{
  display:flex;
  gap:9px;
  overflow:auto;
  margin-bottom:17px;
  padding-bottom:4px;
}

.cat{
  white-space:nowrap;
  padding:10px 16px;
  border:1px solid #e8e8e8;
  background:#fff;
  border-radius:22px;
  font-size:12px;
  font-weight:700;
  color:#555;
}

.cat.on{
  background:#ff4d2d;
  color:#fff;
  border-color:#ff4d2d;
}

.filters{
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filter{
  height:38px;
  padding:0 10px;
  background:#fff;
  border:1px solid #e6e6e6;
  border-radius:9px;
  display:flex;
  align-items:center;
  gap:7px;
}

.filter label{
  font-size:9px;
  color:#999;
  font-weight:800;
}

.filter select{
  border:0;
  outline:0;
  background:transparent;
  font-size:11px;
  font-weight:700;
}

.count{
  margin-left:auto;
  color:#777;
  font-size:12px;
  font-weight:700;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:20px;
}

.card{
  background:#fff;
  border:1px solid #eee;
  border-radius:17px;
  overflow:hidden;
  box-shadow:0 5px 22px rgba(0,0,0,.045);
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  box-shadow:0 14px 35px rgba(0,0,0,.10);
}

.photo{
  height:190px;
  background:#f4f4f4;
  position:relative;
  overflow:hidden;
}

.photo img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.badge{
  position:absolute;
  left:10px;
  top:10px;
  padding:6px 8px;
  border-radius:7px;
  background:rgba(255,255,255,.96);
  font-size:9px;
  font-weight:800;
}

.fav{
  position:absolute;
  right:10px;
  top:10px;
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#fff;
  font-size:17px;
  box-shadow:0 4px 15px rgba(0,0,0,.12);
}

.fav.active{
  color:#ff3f61;
}

.content{
  padding:13px;
}

.title{
  display:flex;
  justify-content:space-between;
  gap:8px;
}

.title h3{
  font-size:15px;
  line-height:1.25;
}

.rating{
  padding:5px 6px;
  border-radius:7px;
  background:#eaf8f0;
  color:#159957;
  font-size:9px;
  font-weight:800;
  height:max-content;
}

.desc{
  height:38px;
  overflow:hidden;
  margin-top:8px;
  color:#777;
  font-size:10.5px;
  line-height:1.45;
}

.meta{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
  margin-top:9px;
  color:#666;
  font-size:9px;
}

.veg{
  color:#159957;
  font-weight:800;
}

.nv{
  color:#d63d32;
  font-weight:800;
}

.bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:13px;
}

.price{
  font-size:17px;
  font-weight:900;
}

.add{
  height:34px;
  min-width:65px;
  border:0;
  border-radius:10px;
  background:#fff0ec;
  color:#ff4d2d;
  font-size:11px;
  font-weight:900;
}

.add:hover{
  background:#ff4d2d;
  color:#fff;
}

.qty{
  display:flex;
  align-items:center;
  gap:8px;
}

.qty button{
  width:28px;
  height:28px;
  border:1px solid #eee;
  background:#fff;
  border-radius:8px;
  font-weight:900;
}

.empty{
  grid-column:1/-1;
  background:#fff;
  border:1px solid #eee;
  border-radius:17px;
  padding:70px;
  text-align:center;
  color:#777;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  background:#222;
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-size:12px;
  font-weight:700;
  transition:.2s;
  z-index:999999;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

@media(max-width:1000px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:760px){
  .wrap{
    width:calc(100% - 24px);
  }

  .links{
    display:none;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .grid{
    grid-template-columns:1fr;
  }

  .photo{
    height:220px;
  }

  .pname{
    display:none;
  }
}
</style>
</head>

async function loadFoodData(){

  const bytes =
    Uint8Array.from(
      atob(FOOD_DATA_COMPRESSED),
      c => c.charCodeAt(0)
    );

  const stream =
    new Blob([bytes])
      .stream()
      .pipeThrough(
        new DecompressionStream("gzip")
      );

  return await new Response(stream).json();
}

        "'":"&#39;"
      }[char])
    );

}


function buildFoods(){

  foods=[];

  foodId=1;

  for(
    const [category,names]
    of Object.entries(DATA)
  ){

    names.forEach(
      (
        name,
        index
      ) => {

        const nonVeg =
          /chicken|mutton|fish|egg|keema|pepperoni|sausage|meat|wings|boneless/i
          .test(name);

        foods.push({

          id:foodId++,

          name:name,

          category:category,

          nonVeg:nonVeg,

          price:
            149 +
            (index % 18) * 17,

          rating:
            (
              4.1 +
              (index % 9) * .1
            ).toFixed(1),

          time:
            18 +
            (index % 27),

          restaurant:
            [
              "Oven Story",
              "Pizza Palace",
              "The Pizza Hub",
              "Urban Slice",
              "Burger Singh",
              "Biryani House",
              "Pasta Point"
            ][index % 7]

        });

      }
    );

  }

}


function buildCategories(){

  const cats =
    $("cats");

  cats.innerHTML =
    `
    <button
      class="cat on"
      data-category="All Food"
    >
      🍽️ All Food
    </button>
    `;

  Object.keys(DATA).forEach(
    category => {

      cats.innerHTML +=
        `
        <button
          class="cat"
          data-category="${escapeHTML(category)}"
        >
          ${ICONS[category] || "🍽️"}
          ${escapeHTML(category)}
        </button>
        `;

    }
  );


  cats
    .querySelectorAll(".cat")
    .forEach(
      button => {

        button.onclick =
          () => {

            selectedCategory =
              button.dataset.category;

            cats
              .querySelectorAll(".cat")
              .forEach(
                b =>
                  b.classList.toggle(
                    "on",
                    b === button
                  )
              );

            $("heading").textContent =
              selectedCategory;

            render();

          };

      }
    );

}


function getFilteredFoods(){

  let result =
    foods.filter(
      food => {

        const categoryMatch =
          selectedCategory === "All Food" ||
          food.category === selectedCategory;

        const searchMatch =
          !searchTerm ||
          food.name
            .toLowerCase()
            .includes(
              searchTerm.toLowerCase()
            ) ||
          food.category
            .toLowerCase()
            .includes(
              searchTerm.toLowerCase()
            );

        return (
          categoryMatch &&
          searchMatch
        );

      }
    );


  const type =
    $("type").value;

  const price =
    $("price").value;

  const sort =
    $("sort").value;


  if(type === "veg"){

    result =
      result.filter(
        food =>
          !food.nonVeg
      );

  }


  if(type === "nv"){

    result =
      result.filter(
        food =>
          food.nonVeg
      );

  }


  if(price === "low"){

    result =
      result.filter(
        food =>
          food.price < 200
      );

  }


  if(price === "mid"){

    result =
      result.filter(
        food =>
          food.price >= 200 &&
          food.price <= 300
      );

  }


  if(price === "high"){

    result =
      result.filter(
        food =>
          food.price > 300
      );

  }


  if(sort === "pl"){

    result.sort(
      (a,b) =>
        a.price - b.price
    );

  }


  if(sort === "ph"){

    result.sort(
      (a,b) =>
        b.price - a.price
    );

  }


  if(sort === "az"){

    result.sort(
      (a,b) =>
        a.name.localeCompare(
          b.name
        )
    );

  }


  return result;

}


function placeholder(){

  return (
    "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(
      `
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="900"
        height="600"
      >
        <rect
          width="100%"
          height="100%"
          fill="#f4f4f4"
        />
      </svg>
      `
    )
  );

}


function renderCard(food){

  const cartItem =
    cart.find(
      item =>
        item.id === food.id
    );

  const isFavourite =
    favourites.includes(
      food.id
    );


  return `
    <article class="card">

      <div class="photo">

        <img
          class="food-image"
          data-food-name="${escapeHTML(food.name)}"
          data-category="${escapeHTML(food.category)}"
          src="${placeholder()}"
          alt="${escapeHTML(food.name)}"
          loading="lazy"
        >

        <span class="badge">
          ${ICONS[food.category] || "🍽️"}
          ${escapeHTML(food.category)}
        </span>

        <button
          class="fav ${isFavourite ? "active" : ""}"
          onclick="toggleFavourite(${food.id})"
        >
          ${isFavourite ? "♥" : "♡"}
        </button>

      </div>


      <div class="content">

        <div class="title">

          <h3>
            ${escapeHTML(food.name)}
          </h3>

          <span class="rating">
            ★ ${food.rating}
          </span>

        </div>


        <p class="desc">
          ${escapeHTML(food.name)}
          freshly prepared with quality ingredients
          and EaterGo's delicious standard.
        </p>


        <div class="meta">

          <span
            class="${food.nonVeg ? "nv" : "veg"}"
          >
            ▣
            ${food.nonVeg ? "Non-Veg" : "Pure Veg"}
          </span>

          <span>
            • ${food.time} min
          </span>

          <span>
            • ${escapeHTML(food.restaurant)}
          </span>

        </div>


        <div class="bottom">

          <b class="price">
            ₹${food.price}
          </b>


          ${
            cartItem

            ?

            `
            <div class="qty">

              <button
                onclick="changeQuantity(
                  ${food.id},
                  -1
                )"
              >
                −
              </button>

              <b>
                ${cartItem.quantity}
              </b>

              <button
                onclick="changeQuantity(
                  ${food.id},
                  1
                )"
              >
                +
              </button>

            </div>
            `

            :

            `
            <button
              class="add"
              onclick="addToCart(
                ${food.id}
              )"
            >
              + Add
            </button>
            `
          }

        </div>

      </div>

    </article>
  `;

}


function render(){

  const result =
    getFilteredFoods();


  $("count").textContent =
    result.length +
    " dishes";


  if(!result.length){

    grid.innerHTML =
      `
      <div class="empty">
        No dishes found.
      </div>
      `;

    return;

  }


  grid.innerHTML =
    result
      .map(renderCard)
      .join("");


  updateCartCount();


  setTimeout(
    loadRealFoodImages,
    50
  );

}


function addToCart(id){

  const food =
    foods.find(
      item =>
        item.id === id
    );

  if(!food){
    return;
  }


  const existing =
    cart.find(
      item =>
        item.id === id
    );


  if(existing){

    existing.quantity++;

  }
  else{

    cart.push({

      id:food.id,

      name:food.name,

      category:food.category,

      restaurant:food.restaurant,

      price:food.price,

      quantity:1

    });

  }


  localStorage.setItem(
    "eatergoCart",
    JSON.stringify(cart)
  );


  showToast(
    food.name +
    " added to cart"
  );


  render();

}


function changeQuantity(id,change){

  const item =
    cart.find(
      x =>
        x.id === id
    );


  if(!item){
    return;
  }


  item.quantity +=
    change;


  if(item.quantity <= 0){

    cart =
      cart.filter(
        x =>
          x.id !== id
      );

  }


  localStorage.setItem(
    "eatergoCart",
    JSON.stringify(cart)
  );


  render();

}


function updateCartCount(){

  const total =
    cart.reduce(
      (
        sum,
        item
      ) =>
        sum +
        Number(
          item.quantity || 0
        ),
      0
    );


  $("cc").textContent =
    total;


  $("cc").style.display =
    total
      ? "grid"
      : "none";

}


function toggleFavourite(id){

  if(
    favourites.includes(id)
  ){

    favourites =
      favourites.filter(
        x =>
          x !== id
      );

  }
  else{

    favourites.push(id);

  }


  localStorage.setItem(
    "eatergoFavourites",
    JSON.stringify(
      favourites
    )
  );


  render();

}


let toastTimer;

function showToast(message){

  $("toast").textContent =
    message;

  $("toast")
    .classList
    .add("show");


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        $("toast")
          .classList
          .remove("show");

      },
      2000
    );

}


/* =========================================================
   REAL FOOD IMAGE ENGINE
   =========================================================

   IMPORTANT:

   No:
   - LoremFlickr
   - Unsplash random source
   - category fallback
   - random burger image
   - random pizza image

   Only relevant Openverse results are accepted.
   ========================================================= */

const imageCache =
  JSON.parse(
    localStorage.getItem(
      "eatergoFoodImagesV4"
    ) || "{}"
  );


const usedImageUrls =
  new Set(
    Object.values(
      imageCache
    )
      .map(
        item =>
          item &&
          item.url
      )
      .filter(Boolean)
  );


const pendingImages =
  new Set();


const stopWords =
  new Set([

    "classic",
    "special",
    "chef",
    "house",
    "style",
    "fresh",
    "loaded",
    "royal",
    "big",
    "double",
    "triple",
    "hot",
    "crispy",
    "crunchy",
    "spicy",
    "smoky",
    "premium",
    "healthy",
    "deluxe",
    "new",
    "york",
    "mixed",
    "garden",
    "green",
    "red",
    "white",
    "dark"

  ]);


function imageTokens(text){

  return text
    .toLowerCase()
    .replace(
      /&/g,
      " and "
    )
    .replace(
      /[^a-z0-9 ]/g,
      " "
    )
    .split(/\s+/)
    .filter(
      word =>
        word.length > 2 &&
        !stopWords.has(word)
    );

}


function imageScore(
  item,
  foodName,
  category
){

  const text =
    (
      item.title || ""
    ) +
    " " +
    (
      item.description || ""
    ) +
    " " +
    JSON.stringify(
      item.tags || []
    );


  const lowerText =
    text.toLowerCase();


  const words =
    imageTokens(
      foodName
    );


  if(!words.length){
    return 0;
  }


  let matches=0;


  words.forEach(
    word => {

      if(
        lowerText.includes(
          word
        )
      ){

        matches++;

      }

    }
  );


  let score =
    (
      matches /
      words.length
    ) * 100;


  if(
    lowerText.includes(
      foodName.toLowerCase()
    )
  ){

    score += 100;

  }


  if(
    lowerText.includes(
      category.toLowerCase()
    )
  ){

    score += 10;

  }


  if(
    (item.width || 0)
    >= 700
  ){

    score += 5;

  }


  if(item.watermarked){

    score -= 40;

  }


  return score;

}


async function searchFoodImage(
  foodName,
  category
){

  if(
    imageCache[foodName]
  ){

    return imageCache[
      foodName
    ];

  }


  const queries=[

    foodName,

    foodName +
    " " +
    category

  ];


  for(
    const query
    of queries
  ){

    try{

      const response =
        await fetch(
          "https://api.openverse.org/v1/images/?q=" +
          encodeURIComponent(query) +
          "&page_size=30"
        );


      if(!response.ok){

        continue;

      }


      const data =
        await response.json();


      const candidates =
        (data.results || [])

        .filter(
          item =>
            item.thumbnail ||
            item.url
        )

        .map(
          item => ({

            item:item,

            score:
              imageScore(
                item,
                foodName,
                category
              )

          })
        )

        .sort(
          (
            a,
            b
          ) =>
            b.score -
            a.score
        );


      for(
        const candidate
        of candidates
      ){

        const item =
          candidate.item;


        const imageUrl =
          item.thumbnail ||
          item.url;


        /*
          IMPORTANT:

          60 = minimum relevance.
          Anything below this is rejected.
        */

        if(
          candidate.score < 60
        ){

          continue;

        }


        if(
          !imageUrl
        ){

          continue;

        }


        /*
          Never reuse
          the same image.
        */

        if(
          usedImageUrls.has(
            imageUrl
          )
        ){

          continue;

        }


        usedImageUrls.add(
          imageUrl
        );


        const result={

          url:imageUrl,

          title:
            item.title ||
            foodName,

          source:
            item.foreign_landing_url ||
            item.url ||
            "",

          license:
            item.license ||
            ""

        };


        imageCache[
          foodName
        ] =
          result;


        localStorage.setItem(
          "eatergoFoodImagesV4",
          JSON.stringify(
            imageCache
          )
        );


        return result;

      }

    }
    catch(error){

      console.warn(
        "Food image search failed:",
        foodName
      );

    }

  }


  /*
    No wrong fallback.
    If relevant image isn't found,
    leave card without a wrong food image.
  */

  return null;

}


async function loadRealFoodImages(){

  const images =
    document.querySelectorAll(
      ".food-image"
    );


  for(
    const img
    of images
  ){

    const foodName =
      img.dataset.foodName;

    const category =
      img.dataset.category;


    if(
      !foodName ||
      pendingImages.has(
        foodName
      )
    ){

      continue;

    }


    /*
      Already loaded.
    */

    if(
      img.dataset.loaded ===
      "yes"
    ){

      continue;

    }


    pendingImages.add(
      foodName
    );


    searchFoodImage(
      foodName,
      category
    )
    .then(
      result => {

        if(!result){

          /*
            Keep neutral blank
            placeholder.
            Never wrong image.
          */

          return;

        }


        img.src =
          result.url;


        img.dataset.loaded =
          "yes";


        img.title =
          result.title +
          (
            result.license
              ? " | " +
                result.license
              : ""
          );

      }
    )
    .finally(
      () => {

        pendingImages.delete(
          foodName
        );

      }
    );

  }

}

/* =========================================================
   URL PARAMETERS
   ========================================================= */

function readURL(){

  const params =
    new URLSearchParams(
      window.location.search
    );


  const category =
    params.get(
      "category"
    );


  const query =
    params.get(
      "q"
    );


  const restaurant =
    params.get(
      "restaurant"
    );


  if(
    category &&
    DATA[category]
  ){

    selectedCategory =
      category;

    $("heading")
      .textContent =
      category;

  }


  if(query){

    searchTerm =
      query;

    $("search")
      .value =
      query;

  }


  if(restaurant){

    searchTerm =
      restaurant;

    $("search")
      .value =
      restaurant;

  }

}


/* =========================================================
   START
   ========================================================= */

async function startPage(){

  DATA =
    await loadFoodData();


  buildFoods();

  buildCategories();

  readURL();

  render();

}


startPage();
